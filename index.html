<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENAC GSEA — Audio Lab & ATC Simulator</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #cbd5e1;
    --border-soft: #e2e8f0;
    --ink: #0f172a;
    --body: #334155;
    --muted: #64748b;
    --accent: #d97706;
    --accent-hover: #b45309;
    --ok-bg: #ecfdf5;
    --ok-bd: #34d399;
    --ok-ink: #065f46;
    --miss-bg: #fffbeb;
    --miss-bd: #fcd34d;
    --miss-ink: #92400e;
    --bad-bg: #fef2f2;
    --bad-bd: #f87171;
    --bad-ink: #991b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
  }
  .header-inner {
    max-width: 1240px;
    margin: 0 auto;
    height: 62px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .brand {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffffff;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }
  .brand-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(217, 119, 6, 0.18);
    color: #fbbf24;
    border: 1px solid rgba(217, 119, 6, 0.45);
    padding: 3px 8px;
    border-radius: 6px;
  }
  /* Segmented Aviation Capsule Track */
  nav {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 9999px;
    padding: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
  }
  nav button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  nav button:hover:not(.active) {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
  }
  nav button.active {
    background: #d97706;
    border-color: #d97706;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45);
  }
  .nav-icon {
    font-size: 13.5px;
    line-height: 1;
  }
  .nav-label {
    letter-spacing: -0.01em;
  }
  .nav-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 6px;
    border-radius: 9999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.14);
    color: #cbd5e1;
    transition: all 0.15s ease;
  }
  nav button:hover:not(.active) .nav-badge {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
  }
  nav button.active .nav-badge {
    background: rgba(255, 255, 255, 0.28);
    color: #ffffff;
    font-weight: 800;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
  }
  .hero-shell {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 28px;
  }
  .hero-banner {
    position: relative;
    min-height: 185px;
    background: linear-gradient(135deg, #0b2240 0%, #0f2f57 55%, #0369a1 100%);
    display: flex;
    align-items: center;
  }
  .hero-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right 30%;
  }
  .hero-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.94) 0%, rgba(15, 23, 42, 0.75) 50%, rgba(15, 23, 42, 0.35) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 650px;
    padding: 22px 32px;
  }
  .hero-kicker {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    color: #f59e0b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 8px;
  }
  .hero-title {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .hero-sub {
    margin: 8px 0 0;
    font-size: 14.5px;
    line-height: 1.55;
    color: #f1f5f9;
  }
  .hero-actions {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .btn-hero-light {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: #ffffff;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-hero-light:hover { background: #f0f9ff; }
  .btn-hero-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.42);
    background: rgba(11, 34, 64, 0.58);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-hero-ghost:hover { background: rgba(11, 34, 64, 0.82); }
  .hero-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #ffffff;
  }
  .hero-step {
    padding: 18px 24px;
    border-right: 1px solid var(--border-soft);
  }
  .hero-step:last-child { border-right: none; }
  .step-num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
  }
  .step-head {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .step-body {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
  .grid-sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .debrief-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 14px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
  }
  .debrief-box {
    background: #f7f9fc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .debrief-kicker {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
  }
  .debrief-phase {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 6px 0 4px;
  }
  .vocab-box {
    margin-top: 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .vocab-item {
    background: #fafbfd;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .vocab-term {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .vocab-meaning {
    font-size: 12px;
    color: var(--body);
    margin: 4px 0 0;
  }
  .section-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .section-media {
    position: relative;
    height: 204px;
    background: linear-gradient(135deg, #0f294a, #0369a1);
  }
  .section-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .section-media-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(11, 31, 58, 0.72) 100%);
  }
  .section-media-meta {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 12px;
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    color: #ffffff;
  }
  .section-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 26px;
  }
  .section-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .section-desc {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--body);
    line-height: 1.6;
  }
  .section-list {
    margin: 18px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--border-soft);
    font-size: 13px;
    color: var(--body);
  }
  .section-list ol {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  .section-list li { margin-bottom: 4px; }
  .cat-mini-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 18px;
  }
  .cat-mini-btn {
    border: 1px solid #e2e9f2;
    background: #f7f9fc;
    border-radius: 8px;
    padding: 9px 12px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cat-mini-btn:hover {
    border-color: rgba(3, 105, 161, 0.5);
    background: #eff6fc;
  }
  .cat-mini-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .cat-mini-sub {
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .section-footer {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-header-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .section-header-kicker {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
  }
  .section-header-title {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 4px 0 0;
  }
  .section-header-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .section-header-stats {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: right;
  }
  .stat-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
  }
  .steps-strip {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 16px 0 20px;
    padding: 14px 16px;
    background: #f1f6fb;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--body);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 38px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: #f1f5f9; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .audio-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  audio { width: 100%; height: 40px; }
  .speed-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .spd-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .spd-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 10px;
    margin: 14px 0 22px;
  }
  .word-tile {
    text-align: left;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .word-tile:hover:not(:disabled) { border-color: var(--accent); background: #f8fbff; }
  .word-tile.selected {
    border-color: #f59e0b;
    background: #fffbeb;
    color: #78350f;
    font-weight: 600;
    box-shadow: 0 0 0 1px #f59e0b;
  }
  .word-tile.ok { border-color: var(--ok-bd); background: var(--ok-bg); color: var(--ok-ink); }
  .word-tile.missed { border-color: var(--miss-bd); background: var(--miss-bg); color: var(--miss-ink); }
  .word-tile.wrong { border-color: var(--bad-bd); background: var(--bad-bg); color: var(--bad-ink); }
  .word-state { display: block; font-size: 11px; margin-top: 4px; font-weight: 600; }
  .feedback-box {
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f8fafc;
    margin-bottom: 18px;
    font-size: 14px;
    color: var(--ink);
  }
  .transcript {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 22px;
  }
  .t-line { margin: 8px 0; font-size: 14px; color: var(--ink); }
  .t-speaker {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-right: 8px;
  }
  .hl { background: #fef08a; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
  .gap-text { font-size: 16px; line-height: 2.3; margin: 18px 0 22px; color: var(--ink); }
  .gap-input {
    display: inline-block;
    width: 138px;
    padding: 4px 10px;
    margin: 0 4px;
    border: 1px solid #94a3b8;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: #ffffff;
  }
  .gap-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .gap-input.ok { border-color: var(--ok-bd); background: var(--ok-bg); color: var(--ok-ink); }
  .gap-input.wrong { border-color: var(--bad-bd); background: var(--bad-bg); color: var(--bad-ink); }
  .gap-ans { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ok-ink); margin-left: 4px; font-weight: 700; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tab {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .clip-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
    max-height: 116px;
    overflow-y: auto;
    padding: 2px 0;
  }
  .clip-num {
    min-width: 36px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .clip-num.active { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 700; }
  .clip-num.done { border-color: var(--ok-bd); background: var(--ok-bg); color: var(--ok-ink); }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 840px) {
    .grid-sections { grid-template-columns: 1fr; }
    .debrief-grid { grid-template-columns: 1fr; }
    .hero-steps { grid-template-columns: 1fr; }
    .hero-step { border-right: none; border-bottom: 1px solid var(--border-soft); }
    .hero-step:last-child { border-bottom: none; }
    .steps-strip { grid-template-columns: 1fr; }
    .hero-content { padding: 20px 18px; }
    .hero-title { font-size: 25px; }
  }

  /* Clean Cockpit Header Styling */

  /* Section Picture Hero Banner */
  .section-hero-shell {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 18px;
    box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06);
  }
  .section-hero-banner {
    position: relative;
    min-height: 200px;
    background: linear-gradient(135deg, #0b2240 0%, #0f2f57 55%, #0369a1 100%);
    display: flex;
    align-items: center;
  }
  .section-hero-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .section-hero-content {
    position: relative;
    z-index: 2;
    max-width: 680px;
    padding: 28px 32px;
  }
  .section-hero-kicker {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    color: #f59e0b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  .section-hero-title {
    margin: 0;
    font-size: 26px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .section-hero-sub {
    margin: 8px 0 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: #f1f5f9;
  }

  /* Student Instructions Box */
  .student-instructions {
    background: #ffffff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .student-instructions-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .student-instructions-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .student-instructions-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

  function findScorm(win) {
    var tries = 0;
    while (win && !win.API && tries < 8) {
      if (win.parent === win) break;
      win = win.parent;
      tries++;
    }
    return (win && win.API) ? win.API : null;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function getShuffledWords(drill) {
    if (state.wordOrderCache[drill.id]) return state.wordOrderCache[drill.id];
    var all = drill.heardWords.map(function(w) { return { text: w, heard: true }; })
      .concat(drill.distractorWords.map(function(w) { return { text: w, heard: false }; }));
    for (var i = all.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = all[i]; all[i] = all[j]; all[j] = tmp;
    }
    state.wordOrderCache[drill.id] = all;
    return all;
  }

  function highlightTranscript(text, heardWords) {
    var html = esc(text);
    var patterns = heardWords
      .slice()
      .sort(function(a, b) { return b.length - a.length; })
      .map(function(w) { return esc(w).replace(/[.*+?^$()|[\]\\]/g, '\\$&'); })
      .filter(Boolean);
    if (patterns.length === 0) return html;
    return html.replace(new RegExp('(' + patterns.join('|') + ')', 'gi'), '<span class="hl">$1</span>');
  }

  function renderGap() {
    var cats = ['atis', 'afis', 'clearance', 'ground', 'pushback', 'taxiway'];
    var catNames = { atis: 'ATIS', afis: 'AFIS', clearance: 'Route Clearance', ground: 'Ground', pushback: 'Pushback', taxiway: 'Taxiway Movements' };
    var byCat = DATA.gapExercises.filter(function(g) { return g.category === state.gapCat; });
    if (byCat.length === 0) {
      for (var c = 0; c < cats.length; c++) {
        var list = DATA.gapExercises.filter(function(g) { return g.category === cats[c]; });
        if (list.length > 0) { state.gapCat = cats[c]; byCat = list; state.gapIdx = 0; break; }
      }
    }
    var ex = byCat[state.gapIdx] || byCat[0];
    if (!ex) return '<div class="stage-card">No Section 2 exercises included in this package.</div>';

    var vals = state.gapValues[ex.id] || {};
    var checked = !!state.checkedGap[ex.id];

    var catTabs = cats.map(function(c) {
      var cnt = DATA.gapExercises.filter(function(g) { return g.category === c; }).length;
      if (cnt === 0) return '';
      return '<button class="tab' + (state.gapCat === c ? ' active' : '') + '" data-cat="' + c + '">' + catNames[c] + ' (' + cnt + ')</button>';
    }).join('');

    var exNums = byCat.map(function(item, idx) {
      var isCur = idx === state.gapIdx;
      var isDone = !!state.checkedGap[item.id];
      var cls = 'clip-num' + (isCur ? ' active' : '') + (isDone ? ' done' : '');
      return '<button class="' + cls + '" data-gidx="' + idx + '">Drill ' + String(idx + 1).padStart(2, '0') + (isDone ? ' ✓' : '') + '</button>';
    }).join('');

    var correctCount = 0;
    var renderedText = esc(ex.templateText).replace(/\{\{(\d+)\}\}/g, function(_m, idxStr) {
      var idx = Number(idxStr);
      var blank = ex.blanks[idx];
      if (!blank) return '';
      var val = vals[idx] || '';
      var isOk = false;
      if (checked) {
        var nVal = normAns(val);
        isOk = blank.acceptedAnswers.some(function(a) { return normAns(a) === nVal; }) || normAns(blank.answer) === nVal;
        if (isOk) correctCount++;
      }
      var cls = 'gap-input' + (checked ? (isOk ? ' ok' : ' wrong') : '');
      var ph = state.showHints ? blank.hint : 'Type answer';
      return '<input class="' + cls + '" data-blank="' + idx + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + (checked ? ' disabled' : '') + ' />' +
        (checked && !isOk ? '<span class="gap-ans">(' + esc(blank.answer) + ')</span>' : '');

    var summaryHtml = checked ? (
      '<div class="feedback-box"><strong>Evaluation Result:</strong> You got <strong>' + correctCount + ' of ' + ex.blanks.length + '</strong> gaps correct. Corrections are highlighted in green beside the blank.</div>'

    var scriptHtml = checked && state.showGapScript[ex.id] && ex.spokenScript ? (

    ) : '';

    var bannerImg = DATA.images.groundOps || 'assets/section-ground-ops.jpg';

    };
    var cb = document.getElementById('drawer-close-btn');
    if (cb) cb.onclick = closeDrawer;
    var bd = document.getElementById('drawer-backdrop');
    if (bd) bd.onclick = closeDrawer;
  }

  function render() {
    renderNav();
    var root = document.getElementById('app');
    if (!root) return;

    if (state.view === 'home') {
      if (typeof document !== 'undefined' && document.body && document.body.classList) {
        document.body.classList.remove('drawer-open');
      }
      root.innerHTML = '<div class="hub-view">' + renderHome() + '</div>';
      var b1 = document.getElementById('go-real');
      var b2 = document.getElementById('go-gap');
      var b3 = document.getElementById('go-pilot');
      var h1 = document.getElementById('hero-real');
      var h2 = document.getElementById('hero-gap');
      var h3 = document.getElementById('hero-pilot');
      if (b1) b1.onclick = function() { state.view = 'real'; render(); };
      if (b2) b2.onclick = function() { state.view = 'gap'; render(); };
      if (b3) b3.onclick = function() { state.view = 'pilot'; render(); };
      if (h1) h1.onclick = function() { state.view = 'real'; render(); };
      if (h2) h2.onclick = function() { state.view = 'gap'; render(); };
      if (h3) h3.onclick = function() { state.view = 'pilot'; render(); };
      root.querySelectorAll('[data-home-cat]').forEach(function(btn) {
        btn.onclick = function() {
          state.gapCat = btn.getAttribute('data-home-cat');
          state.gapIdx = 0;
          state.view = 'gap';
          render();
        };
      });
      return;
    }

    if (typeof document !== 'undefined' && document.body && document.body.classList) {
      document.body.classList.add('drawer-open');
    }

    if (state.view === 'real') {
      root.innerHTML = wrapInDrawer(renderReal(), 'SECTION 1 · REAL ATC', 'Real Pilot–Controller Word Identification (18 Clips)');
      attachDrawerClose(root);
      var drill = DATA.realDrills[state.realIdx];
      var audio = document.getElementById('clip-audio');
      if (audio) audio.playbackRate = state.speed;
      root.querySelectorAll('[data-spd]').forEach(function(b) {
        b.onclick = function() {
          state.speed = Number(b.getAttribute('data-spd'));
          if (audio) audio.playbackRate = state.speed;
          root.querySelectorAll('[data-spd]').forEach(function(x) {
            x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
          });
        };
      });
      root.querySelectorAll('[data-ridx]').forEach(function(b) {
        b.onclick = function() { state.realIdx = Number(b.getAttribute('data-ridx')); render(); };
      });
      root.querySelectorAll('[data-word]').forEach(function(b) {
        b.onclick = function() {
          var w = b.getAttribute('data-word');
          if (!state.selectedWords[drill.id]) state.selectedWords[drill.id] = {};
          state.selectedWords[drill.id][w] = !state.selectedWords[drill.id][w];
          var isPicked = !!state.selectedWords[drill.id][w];
          b.classList.toggle('selected', isPicked);
          var selCount = Object.values(state.selectedWords[drill.id] || {}).filter(Boolean).length;
          var counterEl = document.getElementById('sel-counter');
          if (counterEl) {
            counterEl.textContent = selCount + ' word' + (selCount === 1 ? '' : 's') + ' selected';
          }
        };
      });
      var chk = document.getElementById('check-real');
      if (chk) chk.onclick = function() { state.checkedReal[drill.id] = true; markProgress(); render(); };
      var retry = document.getElementById('retry-real');
      if (retry) retry.onclick = function() { delete state.checkedReal[drill.id]; state.selectedWords[drill.id] = {}; render(); };
      var prev = document.getElementById('prev-real');
      if (prev) prev.onclick = function() { if (state.realIdx > 0) { state.realIdx--; render(); } };
      var next = document.getElementById('next-real');
      if (next) next.onclick = function() { if (state.realIdx < DATA.realDrills.length - 1) { state.realIdx++; render(); } };
      return;
    }

    if (state.view === 'pilot') {
      root.innerHTML = wrapInDrawer(renderPilot(), 'SECTION 3 · PILOT CALLS', 'Routine & Non-Routine Pilot Messages (5 Calls)');
      attachDrawerClose(root);
      var pList = getFilteredPilotMessages();
      var pEx = pList[state.pilotIdx] || pList[0];
      var pAudio = document.getElementById('pilot-audio');
      if (pAudio) pAudio.playbackRate = state.speed;
      root.querySelectorAll('[data-spd]').forEach(function(b) {
        b.onclick = function() {
          state.speed = Number(b.getAttribute('data-spd'));
          if (pAudio) pAudio.playbackRate = state.speed;
          root.querySelectorAll('[data-spd]').forEach(function(x) {
            x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
          });
        };
      });
      root.querySelectorAll('[data-pfilter]').forEach(function(b) {
        b.onclick = function() { state.pilotFilter = b.getAttribute('data-pfilter'); state.pilotIdx = 0; render(); };
      });
      root.querySelectorAll('[data-pidx]').forEach(function(b) {
        b.onclick = function() { state.pilotIdx = Number(b.getAttribute('data-pidx')); render(); };
      });
      root.querySelectorAll('[data-pblank]').forEach(function(inp) {
        inp.oninput = function() {
          var idx = Number(inp.getAttribute('data-pblank'));
          if (!state.pilotValues[pEx.id]) state.pilotValues[pEx.id] = {};
          state.pilotValues[pEx.id][idx] = inp.value;
        };
      });
      var tph = document.getElementById('toggle-pilot-hints');
      if (tph) tph.onclick = function() { state.showHints = !state.showHints; render(); };
      var cp = document.getElementById('check-pilot');
      if (cp) cp.onclick = function() { state.checkedPilot[pEx.id] = true; markProgress(); render(); };
      var rp = document.getElementById('retry-pilot');
      if (rp) rp.onclick = function() { delete state.checkedPilot[pEx.id]; state.pilotValues[pEx.id] = {}; render(); };
      var tps = document.getElementById('toggle-pilot-script');
      if (tps) tps.onclick = function() { state.showPilotScript[pEx.id] = !state.showPilotScript[pEx.id]; render(); };
      var pp = document.getElementById('prev-pilot');
      if (pp) pp.onclick = function() { if (state.pilotIdx > 0) { state.pilotIdx--; render(); } };
      var np = document.getElementById('next-pilot');
      if (np) np.onclick = function() { if (state.pilotIdx < pList.length - 1) { state.pilotIdx++; render(); } };
      return;
    }

    // Gap View
    root.innerHTML = wrapInDrawer(renderGap(), 'SECTION 2 · GROUND OPS', 'European & ICAO Ground Operations Gap-Fill');
    attachDrawerClose(root);
    var byCat = DATA.gapExercises.filter(function(g) { return g.category === state.gapCat; });
    var ex = byCat[state.gapIdx] || byCat[0];
    var gAudio = document.getElementById('gap-audio');
    if (gAudio) gAudio.playbackRate = state.speed;
    root.querySelectorAll('[data-spd]').forEach(function(b) {
      b.onclick = function() {
        state.speed = Number(b.getAttribute('data-spd'));
        if (gAudio) gAudio.playbackRate = state.speed;
        root.querySelectorAll('[data-spd]').forEach(function(x) {
          x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
        });
      };
    });
    root.querySelectorAll('[data-cat]').forEach(function(b) {
      b.onclick = function() { state.gapCat = b.getAttribute('data-cat'); state.gapIdx = 0; render(); };
    });
    root.querySelectorAll('[data-gidx]').forEach(function(b) {
      b.onclick = function() { state.gapIdx = Number(b.getAttribute('data-gidx')); render(); };
    });
    root.querySelectorAll('[data-blank]').forEach(function(inp) {
      inp.oninput = function() {
        var idx = Number(inp.getAttribute('data-blank'));
        if (!state.gapValues[ex.id]) state.gapValues[ex.id] = {};
        state.gapValues[ex.id][idx] = inp.value;
      };
    });
    var th = document.getElementById('toggle-hints');
    if (th) th.onclick = function() { state.showHints = !state.showHints; render(); };
    var cg = document.getElementById('check-gap');
    if (cg) cg.onclick = function() { state.checkedGap[ex.id] = true; markProgress(); render(); };
    var rg = document.getElementById('retry-gap');
    if (rg) rg.onclick = function() { delete state.checkedGap[ex.id]; state.gapValues[ex.id] = {}; render(); };
    var tgs = document.getElementById('toggle-gap-script');
    if (tgs) tgs.onclick = function() { state.showGapScript[ex.id] = !state.showGapScript[ex.id]; render(); };
    var pg = document.getElementById('prev-gap');
    if (pg) pg.onclick = function() { if (state.gapIdx > 0) { state.gapIdx--; render(); } };
    var ng = document.getElementById('next-gap');
    if (ng) ng.onclick = function() { if (state.gapIdx < byCat.length - 1) { state.gapIdx++; render(); } };
  }

  // Keyboard shortcut: ESC closes active exercise drawer
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && state.view !== 'home') {
      var root = document.getElementById('app');
      if (root) root.querySelectorAll('audio').forEach(function(a) { try { a.pause(); } catch(err) {} });
      state.view = 'home';
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
