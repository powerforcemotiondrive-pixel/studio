<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENAC GSEA — Audio Lab & ATC Simulator</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #cbd5e1;
    --border-soft: #e2e8f0;
    --ink: #0f172a;
    --body: #334155;
    --muted: #64748b;
    --accent: #d97706;
    --accent-hover: #b45309;
    --ok-bg: #ecfdf5;
    --ok-bd: #34d399;
    --ok-ink: #065f46;
    --miss-bg: #fffbeb;
    --miss-bd: #fcd34d;
    --miss-ink: #92400e;
    --bad-bg: #fef2f2;
    --bad-bd: #f87171;
    --bad-ink: #991b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f1f5f9;
    background-image: radial-gradient(rgba(0, 0, 0, 0.085) 1.25px, transparent 1.25px);
    background-size: 20px 20px;
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Centered Cockpit Deck Chassis (S1/S2/S3 & Teachers Canvas Parity) */
  .moodle-deck-wrapper {
    min-height: 100vh;
    padding: 24px 16px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  @media (max-width: 768px) {
    .moodle-deck-wrapper {
      padding: 0;
    }
  }

  .moodle-deck-canvas {
    width: 100%;
    max-width: 1240px;
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid rgba(203, 213, 225, 0.85);
    box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(15, 23, 42, 0.04);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.3s ease;
  }
  @media (max-width: 768px) {
    .moodle-deck-canvas {
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  /* Signature CAD Micro-Grid Technical Surface (Semester 1 & Teachers Parity) */
  .textured-surface,
  header {
    background-color: #1e293b !important;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.18) 0%, transparent 75%),
      linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(0, 0, 0, 0.18) 100%) !important;
    background-size: 100% 100%, 16px 16px, 16px 16px, 100% 100% !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), inset 0 -1px 0 rgba(0, 0, 0, 0.35) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .header-inner {
    max-width: 100%;
    margin: 0;
    height: 62px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .brand {
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffffff;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }
  .brand-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(217, 119, 6, 0.18);
    color: #fbbf24;
    border: 1px solid rgba(217, 119, 6, 0.45);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .beta-pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    background: #d97706;
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .beta-notice-banner {
    background: #fffbeb;
    border: 1px solid #f59e0b;
    border-left: 4px solid #d97706;
    color: #78350f;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    line-height: 1.45;
  }
  .brand-icon {
    color: #f59e0b;
    filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.5));
  }
  /* Segmented Aviation Capsule Track */
  nav {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 9999px;
    padding: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
  }
  nav button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  nav button:hover:not(.active) {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
  }
  nav button.active {
    background: #d97706;
    border-color: #d97706;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45);
  }
  .nav-icon {
    font-size: 13.5px;
    line-height: 1;
  }
  .nav-label {
    letter-spacing: -0.01em;
  }
  .nav-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 6px;
    border-radius: 9999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.14);
    color: #cbd5e1;
    transition: all 0.15s ease;
  }
  nav button:hover:not(.active) .nav-badge {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
  }
  nav button.active .nav-badge {
    background: rgba(255, 255, 255, 0.28);
    color: #ffffff;
    font-weight: 800;
  }
  main {
    max-width: 100%;
    margin: 0;
    padding: 24px 28px 36px;
    background: #f8fafc;
    flex: 1 1 auto;
  }
  @media (max-width: 768px) {
    main {
      padding: 16px 14px 28px;
    }
  }
  .deck-canvas-footer {
    background: #0f172a;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: #94a3b8;
    flex-wrap: wrap;
    gap: 8px;
  }
  .deck-footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .status-indicator-dot {
    width: 7px;
    height: 7px;
    border-radius: 9999px;
    background: #10b981;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    display: inline-block;
  }
  .deck-footer-right {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
    color: #64748b;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
  }
  .hero-shell {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 28px;
  }
  .hero-banner {
    position: relative;
    min-height: 185px;
    background: linear-gradient(135deg, #0b2240 0%, #0f2f57 55%, #0369a1 100%);
    display: flex;
    align-items: center;
  }
  .hero-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right 30%;
  }
  .hero-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.94) 0%, rgba(15, 23, 42, 0.75) 50%, rgba(15, 23, 42, 0.35) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 650px;
    padding: 22px 32px;
  }
  .hero-kicker {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    color: #f59e0b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 8px;
  }
  .hero-title {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .hero-sub {
    margin: 8px 0 0;
    font-size: 14.5px;
    line-height: 1.55;
    color: #f1f5f9;
  }
  .hero-actions {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .btn-hero-light {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: #ffffff;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-hero-light:hover { background: #f0f9ff; }
  .btn-hero-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.42);
    background: rgba(11, 34, 64, 0.58);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-hero-ghost:hover { background: rgba(11, 34, 64, 0.82); }
  .hero-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #ffffff;
  }
  .hero-step {
    padding: 18px 24px;
    border-right: 1px solid var(--border-soft);
  }
  .hero-step:last-child { border-right: none; }
  .step-num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
  }
  .step-head {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .step-body {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
  .grid-sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .debrief-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 14px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
  }
  .debrief-box {
    background: #f7f9fc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .debrief-kicker {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
  }
  .debrief-phase {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 6px 0 4px;
  }
  .vocab-box {
    margin-top: 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .vocab-item {
    background: #fafbfd;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .vocab-term {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .vocab-meaning {
    font-size: 12px;
    color: var(--body);
    margin: 4px 0 0;
  }
  .section-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .section-media {
    position: relative;
    height: 204px;
    background: linear-gradient(135deg, #0f294a, #0369a1);
  }
  .section-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .section-media-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(11, 31, 58, 0.72) 100%);
  }
  .section-media-meta {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 12px;
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    color: #ffffff;
  }
  .section-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 26px;
  }
  .section-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .section-desc {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--body);
    line-height: 1.6;
  }
  .section-list {
    margin: 18px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--border-soft);
    font-size: 13px;
    color: var(--body);
  }
  .section-list ol {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  .section-list li { margin-bottom: 4px; }
  .cat-mini-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 18px;
  }
  .cat-mini-btn {
    border: 1px solid #e2e9f2;
    background: #f7f9fc;
    border-radius: 8px;
    padding: 9px 12px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cat-mini-btn:hover {
    border-color: rgba(3, 105, 161, 0.5);
    background: #eff6fc;
  }
  .cat-mini-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .cat-mini-sub {
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .section-footer {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-header-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .section-header-kicker {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
  }
  .section-header-title {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 4px 0 0;
  }
  .section-header-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .section-header-stats {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: right;
  }
  .stat-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
  }
  .steps-strip {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 16px 0 20px;
    padding: 14px 16px;
    background: #f1f6fb;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--body);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 38px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: #f1f5f9; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .audio-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .audio-box audio { display: none; }
  .custom-audio-player {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .cap-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cap-play-btn {
    width: 38px;
    height: 38px;
    border-radius: 9999px;
    border: none;
    background: #0f172a;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
  }
  .cap-play-btn:hover { background: #1e293b; }
  .cap-play-btn:active { transform: scale(0.96); }
  .cap-play-btn.playing { background: #d97706; }
  .cap-play-btn.playing:hover { background: #b45309; }
  .cap-rew-btn {
    height: 30px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #0f172a;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .cap-rew-btn:hover { background: #e2e8f0; border-color: #94a3b8; }
  .cap-track-wrap {
    flex: 1;
    padding: 10px 0;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    min-width: 80px;
  }
  .cap-track {
    position: relative;
    height: 10px;
    border-radius: 9999px;
    background: #e2e8f0;
    border: 1px solid #cbd5e1;
    overflow: visible;
  }
  .cap-fill {
    height: 100%;
    width: 0%;
    border-radius: 9999px;
    background: #0f172a;
    pointer-events: none;
  }
  .cap-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 16px;
    height: 16px;
    border-radius: 9999px;
    background: #0f172a;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.45);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .cap-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    min-width: 84px;
    text-align: right;
    flex-shrink: 0;
  }
  .speed-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .spd-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .spd-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 10px;
    margin: 14px 0 22px;
  }
  .word-tile {
    text-align: left;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .word-tile:hover:not(:disabled) { border-color: var(--accent); background: #f8fbff; }
  .word-tile.selected {
    border-color: #f59e0b;
    background: #fffbeb;
    color: #78350f;

  /* --- IN-DECK SLIDE-OVER EXERCISE DRAWER (S1/S2/S3/TEACHERS HUB ARCHITECTURE) --- */
  .hub-underlay {
    transition: filter 0.25s ease, opacity 0.25s ease;
  }
  body.drawer-open {
    overflow: hidden;
  }
  body.drawer-open .hub-underlay {
    filter: blur(2px) grayscale(12%);
    opacity: 0.55;
    pointer-events: none;
    user-select: none;

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.68);

  @keyframes drawerFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }

    position: fixed;
    top: 0;

ch Number for Fuel Economy","templateText":"KLM 1705 at {{0}}: traffic permitting, requesting speed reduction to Mach {{1}} for {{2}} economy.","spokenScript":"Maastricht Control, KLM one seven zero five, maintaining flight level three eight zero. Traffic permitting, requesting to reduce speed to Mach decimal seven six for fuel economy.","phaseOfFlight":"Cruise","contextSummary":"When ahead of schedule or flying into strong headwinds, reducing cruise speed by 0.02 Mach can save significant fuel. Pilots must ask ATC first so slower speed does not compress spacing behind them.","usefulVocabulary":[{"term":"Mach decimal seven six","meaning":"Flying at 76% of the local speed of sound."},{"term":"Fuel economy","meaning":"Adjusting cruise speed to minimize fuel burn and CO2 emissions."},{"term":"Maastricht Control","meaning":"Eurocontrol Upper Area Control Centre managing high-altitude flights over Benelux and northwest Germany."}],"audioSrc":"audio/pilot_pilot_72_KLM1705.m4a","blanks":[{"answer":"FL380","acceptedAnswers":["FL380","380","FL 380","flight level 380"],"hint":"Cruise level"},{"answer":"0.76","acceptedAnswers":["0.76",".76","decimal 76","point 76"],"hint":"Requested Mach number"},{"answer":"fuel","acceptedAnswers":["fuel","cost"],"hint":"Reason for slowing down"}]},{"id":"pilot_73","indexNumber":73,"messageType":"non_routine","callsign":"Luxair 782","sector":"Luxembourg Approach","frequencyMHz":"118.905","title":"Fuel Imbalance — Requesting Straight-In Approach","templateText":"Luxair 782 descending 6,000 ft: minor fuel {{0}} between wing tanks with {{1}} open. Requesting a straight-in approach for Runway {{2}}.","spokenScript":"Luxembourg Approach, Luxair seven eight two, descending six thousand feet. We have a minor fuel imbalance between the left and right wing tanks and have crossfeed open. Requesting a straight-in approach for runway two four.","phaseOfFlight":"Approach — Abnormal Fuel Management","contextSummary":"An uneven fuel load makes one wing heavier than the other. While balancing the tanks via the crossfeed valve, the crew asks for a simple straight-in approach without sharp turns.","usefulVocabulary":[{"term":"Fuel imbalance","meaning":"Unequal fuel weight between the left and right wing tanks."},{"term":"Crossfeed open","meaning":"Fuel valve opened so both engines draw from the heavier tank until weight is balanced."},{"term":"Straight-in approach","meaning":"Lining up directly with the final approach path without flying a downwind leg."}],"audioSrc":"audio/pilot_pilot_73_Luxair782.m4a","blanks":[{"answer":"imbalance","acceptedAnswers":["imbalance","unbalance"],"hint":"Fuel condition"},{"answer":"crossfeed","acceptedAnswers":["crossfeed","cross-feed","cross feed"],"hint":"Balancing valve opened"},{"answer":"24","acceptedAnswers":["24","two four"],"hint":"Landing runway"}]},{"id":"pilot_74","indexNumber":74,"messageType":"routine","callsign":"Air France 1508","sector":"Paris CDG Apron","frequencyMHz":"121.830","title":"Ready for Pushback With Tug Connected","templateText":"Air France 1508 at gate {{0}}, doors closed, {{1}} connected, ready for pushback facing {{2}}.","spokenScript":"De Gaulle Apron, Air France one five zero eight, gate Foxtrot three two, doors closed, tug connected, ready for pushback facing east.","phaseOfFlight":"Preflight / Pushback","contextSummary":"Once boarding is finished, cabin doors are armed, and the ground tractor is locked onto the nosewheel, the captain calls Apron Control for pushback clearance.","usefulVocabulary":[{"term":"Tug connected","meaning":"The tow tractor is attached to the nose landing gear and ready to push the aircraft back."},{"term":"Facing east","meaning":"Direction the aircraft nose will point once pushback finishes."},{"term":"Doors closed","meaning":"All passenger and cargo doors are shut so the flight is completely ready to move."}],"audioSrc":"audio/pilot_pilot_74_AirFrance1508.m4a","blanks":[{"answer":"F32","acceptedAnswers":["F32","Foxtrot 32","Foxtro om a wing heating pipe, forcing the crew to shut that valve off."},{"term":"Moderate icing","meaning":"Rate of ice accumulation that requires continuous anti-ice protection or exit from the layer."},{"term":"Warmer air","meaning":"Lower altitudes where outside air temperature is above 0°C so ice melts away."}],"audioSrc":"audio/pilot_pilot_77_SAS814.m4a","blanks":[{"answer":"anti-ice","acceptedAnswers":["anti-ice","anti ice","de-ice"],"hint":"Failed wing system"},{"answer":"FL120","acceptedAnswers":["FL120","120","FL 120","flight level 120"],"hint":"Lower level requested"},{"answer":"warmer","acceptedAnswers":["warmer","warm","ice-free"],"hint":"Temperature condition sought"}]},{"id":"pilot_78","indexNumber":78,"messageType":"routine","callsign":"Vueling 1904","sector":"Madrid Tower","frequencyMHz":"118.675","title":"Runway Vacated — Switching to Apron","templateText":"Vueling 1904, Runway {{0}} vacated via {{1}}. Switching to Ground on {{2}} MHz.","spokenScript":"Madrid Tower, Vueling one niner zero four, runway three two right vacated via Mike six. Switching to Ground on one two one decimal eight five zero, good day.","phaseOfFlight":"Landing Roll / Vacating Runway","contextSummary":"As soon as the tail clears the runway holding line, the pilot reports vacated and confirms the handover to Ground frequency so Tower can clear the next aircraft to land or depart.","usefulVocabulary":[{"term":"Vacated via Mike 6","meaning":"Exited the active runway onto high-speed turnoff taxiway M6."},{"term":"Switching to Ground","meaning":"Changing VHF radio frequency from Tower to Ground Control for taxi to the gate."},{"term":"Good day","meaning":"Standard polite sign-off when leaving an ATC frequency."}],"audioSrc":"audio/pilot_pilot_78_Vueling1904.m4a","blanks":[{"answer":"32R","acceptedAnswers":["32R","32 right","three two right"],"hint":"Landing runway"},{"answer":"M6","acceptedAnswers":["M6","Mike 6","Mike six"],"hint":"Rapid exit taxiway"},{"answer":"121.850","acceptedAnswers":["121.850","121.85","one two one decimal eight five zero"],"hint":"Next VHF frequency"}]},{"id":"pilot_79","indexNumber":79,"messageType":"non_routine","callsign":"Air France 1680","sector":"London Approach","frequencyMHz":"119.730","title":"Slats Jammed Retracted — Requesting Longer Runway","templateText":"PAN PAN, Air France 1680: leading edge {{0}} jammed retracted, higher landing speed. Requesting longer Runway {{1}} and {{2}} minutes for checklists.","spokenScript":"London Director, PAN PAN, PAN PAN, PAN PAN, Air France one six eight zero, descending six thousand feet. Our leading edge slats are jammed retracted, giving us a higher landing speed. Requesting the longer runway two seven right and ten minutes to complete checklists.","phaseOfFlight":"Approach — Abnormal Configuration","contextSummary":"Without leading-edge slats extended, approach speed increases significantly and braking distance is longer. Asking for the longer runway and extra checklist time ensures a calm, safe touchdown.","usefulVocabulary":[{"term":"Leading-edge slats","meaning":"Movable panels on the front edge of the wing that allow slower, safer landing speeds."},{"term":"Jammed retracted","meaning":"Stuck in the clean cruise position and unable to extend."},{"term":"Longer runway","meaning":"Selecting the runway with greater Landing Distance Available (LDA) for high-speed touchdown."}],"audioSrc":"audio/pilot_pilot_79_AirFrance1680.m4a","blanks":[{"answer":"slats","acceptedAnswers":["slats","slat"],"hint":"Front wing lift devices"},{"answer":"27R","acceptedAnswers":["27R","27 right","two seven right"],"hint":"Longer runway requested"},{"answer":"10","acceptedAnswers":["10","ten"],"hint":"Checklist time needed"}]},{"id":"pilot_80","indexNumber":80,"messageType":"routine","callsign":"Lufthansa 1044","sector":"Karlsruhe Control","frequencyMHz":"134.155","title":"Requesting Level Change to Avoid Persistent Contrail Turbulence","templateText":"Lufthansa 1044 at {{0}}: continuous light {{1}} chop from traffic ahead; requesting {{2}} if available.","spokenScript":"Rhein Radar, Lufthansa one zero four four, maintaining flight level three one zero. We are getting continuous light wake chop from traffic ahead; requesting flight level three three zero if available.","phaseOfFlight":"Cruise","contextSummary":"On busy European trunk airways, trailing directly behind another jet can create persistent light wake bumps. Moving up 2,000 feet restores a quiet cabin.","usefulVocabulary":[{"term":"Rhein Radar","meaning":"Radio callsign of Karlsruhe Upper Area Control Centre in southern Germany."},{"term":"Continuous light chop","meaning":"Steady minor bumping caused by flying in another aircraft’s slipstream."},{"term":"If available","meaning":"Indicates a routine preference dependent on upper-airspace traffic."}],"audioSrc":"audio/pilot_pilot_80_Lufthansa1044.m4a","blanks":[{"answer":"FL310","acceptedAnswers":["FL310","310","FL 310","flight level 310"],"hint":"Current level"},{"answer":"wake","acceptedAnswers":["wake","turbulence"],"hint":"Cause of light chop"},{"answer":"FL330","acceptedAnswers":["FL330","330","FL 330","flight level 330"],"hint":"Requested level"}]},{"id":"pilot_81","indexNumber":81,"messageType":"non_routine","callsign":"EasyJet 2176","sector":"Milan Malpensa Ground","frequencyMHz":"121.905","title":"Unattended Suspicious Bag Found During Taxi","templateText":"EasyJet 2176 on Taxiway {{0}}: cabin crew found an unattended {{1}} with no owner on board. Requesting return to a {{2}} stand and security.","spokenScript":"Malpensa Ground, EasyJet two one seven six holding on taxiway Charlie. Cabin crew has found an unattended bag in the overhead bin with no owner on board. Requesting immediate return to a remote stand and security assistance.","phaseOfFlight":"Taxi-Out — Security Return","contextSummary":"Aviation security regulations strictly prohibit flying with an unclaimed bag. The captain halts taxi immediately and requests a remote stand away from the main terminal for airport police inspection.","usefulVocabulary":[{"term":"Unattended bag","meaning":"A piece of cabin luggage that no passenger on board claims ownership of."},{"term":"Remote stand","meaning":"An isolated parking bay located away from passenger terminal buildings."},{"term":"Security assistance","meaning":"Airport police or security officers dispatched to inspect an unclaimed item."}],"audioSrc":"audio/pilot_pilot_81_EasyJet2176.m4a","blanks":[{"answer":"Charlie","acceptedAnswers":["Charlie","C"],"hint":"Current taxiway"},{"answer":"bag","acceptedAnswers":["bag","item","luggage"],"hint":"Unclaimed object"},{"answer":"remote","acceptedAnswers":["remote","isolated"],"hint":"Type of parking stand"}]},{"id":"pilot_82","indexNumber":82,"messageType":"routine","callsign":"Swiss 1622","sector":"Zurich Tower","frequencyMHz":"118.105","title":"Standard Missed Approach Climb Report","templateText":"Swiss 1622 executing standard {{0}} Runway {{1}}, passing 3,200 ft climbing 5,000 ft, no visual contact at {{2}}.","spokenScript":"Zurich Tower, Swiss one six two two, executing standard missed approach runway one four, passing three thousand two hundred feet climbing five thousand feet, no visual contact at minimums.","phaseOfFlight":"Go-Around / Missed Approach","contextSummary":"In low cloud or fog, if the runway lights are not clearly visible at Decision Altitude (\"minimums\"), flying a missed approach is a completely routine, mandatory safety manoeuvre.","usefulVocabulary":[{"term":"Minimums / Decision Altitude","meaning":"The lowest published height on an instrument approach where the pilot must see the runway or go around."},{"term":"No visual contact","meaning":"The runway environment could not be seen through cloud or fog."},{"term":"Standard missed approach","meaning":"The published climb track and altitude printed on the approach chart."}],"audioSrc":"audio/pilot_pilot_82_Swiss1622.m4a","blanks":[{"answer":"missed approach","acceptedAnswers":["m it Fumes Emergency","contextSummary":"Toxic oil fumes entering the cockpit from a leaking engine seal can impair pilot judgement. Putting on 100% oxygen masks immediately and declaring MAYDAY for the nearest airport is top priority.","usefulVocabulary":[{"term":"Donned oxygen masks","meaning":"Flight crew have put on quick-donning flight deck oxygen masks."},{"term":"Oil fumes","meaning":"Acrid odour caused by heated engine lubricant entering the bleed air supply."},{"term":"Nearest suitable airport","meaning":"Closest airport with adequate runway length, weather, and fire cover."}],"audioSrc":"audio/pilot_pilot_85_TAPAirPortugal664.m4a","blanks":[{"answer":"oil","acceptedAnswers":["oil","smoke","acrid"],"hint":"Type of cockpit fumes"},{"answer":"oxygen","acceptedAnswers":["oxygen","O2"],"hint":"Crew protective equipment"},{"answer":"suitable","acceptedAnswers":["suitable","available"],"hint":"Airport criterion"}]},{"id":"pilot_86","indexNumber":86,"messageType":"routine","callsign":"Brussels Airlines 3578","sector":"Bordeaux Control","frequencyMHz":"128.875","title":"Radio Check on New En-Route Frequency","templateText":"Beeline 3578 checking in on {{0}} MHz, {{1}}, requesting a {{2}} check after static on previous sector.","spokenScript":"Bordeaux Control, Beeline three five seven eight, checking in on one two eight decimal eight seven five, flight level three five zero. How do you read? Had static on the previous sector.","phaseOfFlight":"Cruise","contextSummary":"After experiencing background static on an adjacent sector, the crew checks in on Bordeaux Control and requests a readability check (scale 1 to 5) to confirm their VHF transmitter is healthy.","usefulVocabulary":[{"term":"How do you read?","meaning":"Standard ICAO phrase requesting a radio signal quality report (1 = unreadable to 5 = perfectly readable)."},{"term":"Checking in","meaning":"Making initial contact after switching to a new ATC sector frequency."},{"term":"Previous sector","meaning":"The nei h priority approach and paramedics on stand.","phaseOfFlight":"Cruise — Medical Urgency","contextSummary":"An unexpected premature delivery in flight requires fast ground hospital access. Declaring PAN PAN guarantees straight-line priority routing into Nice with emergency medical crews standing by.","usefulVocabulary":[{"term":"Active labour","meaning":"Childbirth contractions have started and delivery may be imminent."},{"term":"Priority approach","meaning":"ATC clears other traffic out of the sequence so the aircraft lands first."},{"term":"Paramedics on stand","meaning":"Emergency ambulance staff positioned directly at the arrival gate before engines shut down."}],"audioSrc":"audio/pilot_pilot_89_AirFrance7418.m4a","blanks":[{"answer":"labour","acceptedAnswers":["labour","labor"],"hint":"Medical event"},{"answer":"Nice","acceptedAnswers":["Nice","LFMN"],"hint":"Diversion/arrival airport"},{"answer":"paramedics","acceptedAnswers":["paramedics","ambulance","medical"],"hint":"Arrival team requested"}]},{"id":"pilot_90","indexNumber":90,"messageType":"routine","callsign":"Croatia Airlines 462","sector":"Zagreb Control","frequencyMHz":"135.805","title":"Reporting Estimated Time Over FIR Entry Point","templateText":"Croatia 462 maintaining {{0}}, estimating {{1}} at time {{2}}, next waypoint SPL.","spokenScript":"Zagreb Control, Croatia four six two, maintaining flight level three four zero, estimating ZAGAB at time two eight, next waypoint SPL.","phaseOfFlight":"Cruise","contextSummary":"Routine waypoint estimate transmitted on initial contact with Zagreb Control as the flight crosses into Croatian airspace heading south toward Split (SPL).","usefulVocabulary":[{"term":"FIR entry point","meaning":"Published border waypoint where a flight enters a new national Flight Information Region."},{"term":"Next waypoint","meaning":"The subsequent navigation fix along the filed ATS route."},{"term":"Maintaining FL340","meaning":"Level cruise at 34,000 ft on standard altimeter se :92,"messageType":"routine","callsign":"TUI 2418","sector":"Brussels Approach","frequencyMHz":"118.255","title":"Requesting Opposite-Direction Runway Due to Tailwind","templateText":"Beauty 2418 descending FL100: {{0}} knots of {{1}} exceeds our limit on 07L; requesting Runway {{2}}.","spokenScript":"Brussels Approach, Beauty two four one eight, descending flight level one zero zero. With fifteen knots of tailwind on runway zero seven left, we are above our tailwind limit and request runway two five right.","phaseOfFlight":"STAR / Arrival","contextSummary":"Most commercial airliners have a maximum certified landing tailwind limit of 10 or 15 knots. TUI Belgium (\"Beauty\") politely requests the opposite runway to land into the wind safely.","usefulVocabulary":[{"term":"Beauty","meaning":"ICAO radio callsign used by TUI fly Belgium."},{"term":"Tailwind limit","meaning":"Maximum wind speed blowing from behind the aircraft permitted for landing."},{"term":"Opposite-direction runway","meaning":"Using the reciprocal runway heading so the aircraft lands into a headwind."}],"audioSrc":"audio/pilot_pilot_92_TUI2418.m4a","blanks":[{"answer":"15","acceptedAnswers":["15","fifteen"],"hint":"Tailwind speed (knots)"},{"answer":"tailwind","acceptedAnswers":["tailwind","tail wind"],"hint":"Wind component"},{"answer":"25R","acceptedAnswers":["25R","25 right","two five right"],"hint":"Opposite runway requested"}]},{"id":"pilot_93","indexNumber":93,"messageType":"non_routine","callsign":"Eurowings 7144","sector":"Hamburg Tower","frequencyMHz":"126.855","title":"Large Bird Flock Crossing Threshold — Requesting Dispersal","templateText":"Eurowings 7144, 6 miles final Runway {{0}}: large flock of {{1}} over the threshold. Requesting bird {{2}} before short final.","spokenScript":"Hamburg Tower, Eurowings seven one four four, six miles final runway two three. We can see a large flock of gulls circling right over the runway threshold. Requesting bird scaring before we reach short final."," ning off the instrument track into the visual circling leg."}],"audioSrc":"audio/pilot_pilot_94_AirFrance1756.m4a","blanks":[{"answer":"2500","acceptedAnswers":["2500","2,500","two thousand five hundred"],"hint":"Passing altitude (ft)"},{"answer":"west","acceptedAnswers":["west","W"],"hint":"Circling direction"},{"answer":"13L","acceptedAnswers":["13L","13 left","one three left"],"hint":"Landing runway"}]},{"id":"pilot_95","indexNumber":95,"messageType":"non_routine","callsign":"Tarom 381","sector":"Bucharest Control","frequencyMHz":"129.405","title":"Transponder Failure — Switching to Backup Unit","templateText":"Tarom 381 at FL320: failure on {{0}} number 1; switching to unit {{1}}, squawking {{2}}.","spokenScript":"Bucharest Control, Tarom three eight one, maintaining flight level three two zero. We have a failure on transponder number one and are switching to transponder number two, squawking four two one five.","phaseOfFlight":"Cruise — Avionics Switchover","contextSummary":"Commercial airliners carry dual transponders so ATC radar never loses aircraft identification or Mode C altitude. The crew informs Bucharest Control while switching to transponder #2 so the radar label reappears cleanly.","usefulVocabulary":[{"term":"Transponder","meaning":"Cockpit radio receiver-transmitter that sends aircraft identity and altitude to ATC secondary radar."},{"term":"Squawking 4215","meaning":"Confirming the assigned 4-digit octal radar identification code."},{"term":"Backup unit","meaning":"Redundant second avionics system ready to take over immediately."}],"audioSrc":"audio/pilot_pilot_95_Tarom381.m4a","blanks":[{"answer":"transponder","acceptedAnswers":["transponder","XPDR","SSR"],"hint":"Failed radar unit"},{"answer":"2","acceptedAnswers":["2","two","number 2"],"hint":"Backup unit selected"},{"answer":"4215","acceptedAnswers":["4215","four two one five"],"hint":"Assigned squawk code"}]},{"id":"pilot_96","indexNumber":96,"messageType":"routine","callsign":"EasyJet 4910",   function renderGap() {
    var cats = ['atis', 'afis', 'clearance', 'ground', 'pushback', 'taxiway'];
    var catNames = { atis: 'ATIS', afis: 'AFIS', clearance: 'Route Clearance', ground: 'Ground', pushback: 'Pushback', taxiway: 'Taxiway Movements' };
    var byCat = DATA.gapExercises.filter(function(g) { return g.category === state.gapCat; });
    if (byCat.length === 0) {
      for (var c = 0; c < cats.length; c++) {
        var list = DATA.gapExercises.filter(function(g) { return g.category === cats[c]; });
        if (list.length > 0) { state.gapCat = cats[c]; byCat = list; state.gapIdx = 0; break; }
      }
    }
    var ex = byCat[state.gapIdx] || byCat[0];
    if (!ex) return '<div class="stage-card">No Section 2 exercises included in this package.</div>';

    var vals = state.gapValues[ex.id] || {};
    var checked = !!state.checkedGap[ex.id];

    var catTabs = cats.map(function(c) {
      var cnt = DATA.gapExercises.filter(function(g) { return g.category === c; }).length;
      if (cnt === 0) return '';
      return '<button class="tab' + (state.gapCat === c ? ' active' : '') + '" data-cat="' + c + '">' + catNames[c] + ' (' + cnt + ')</button>';
    }).join('');

    var exNums = byCat.map(function(item, idx) {
      var isCur = idx === state.gapIdx;
      var isDone = !!state.checkedGap[item.id];
      var cls = 'clip-num' + (isCur ? ' active' : '') + (isDone ? ' done' : '');
      return '<button class="' + cls + '" data-gidx="' + idx + '">Drill ' + String(idx + 1).padStart(2, '0') + (isDone ? ' ✓' : '') + '</button>';
    }).join('');

    var correctCount = 0;
    var renderedText = esc(ex.templateText).replace(/\{\{(\d+)\}\}/g, function(_m, idxStr) {
      var idx = Number(idxStr);
      var blank = ex.blanks[idx];
      if (!blank) return '';
      var val = vals[idx] || '';
      var isOk = false;
      if (checked) {
        var nVal = normAns(val);
        isOk = blank.acceptedAnswers.some(function(a) { return normAns(a) === nVal; }) || normAns(blank.answer) === nVal;
        if (isOk) correctCount++;
      }
      var cls = 'gap-input' + (checked ? (isOk ? ' ok' : ' wrong') : '');
      var ph = state.showHints ? blank.hint : 'Type answer';
      return '<input class="' + cls + '" data-blank="' + idx + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + (checked ? ' disabled' : '') + ' />' +
        (checked && !isOk ? '<span class="gap-ans">(' + esc(blank.answer) + ')</span>' : '');
    });

    var summaryHtml = checked ? (
      '<div class="feedback-box"><strong>Evaluation Result:</strong> You got <strong>' + correctCount + ' of ' + ex.blanks.length + '</strong> gaps correct. Corrections are highlighted in green beside the blank.</div>'
    ) : '';

    var scriptHtml = checked && state.showGapScript[ex.id] && ex.spokenScript ? (
      '<div class="transcript"><h3 style="margin:0 0 8px;font-size:15px;color:var(--ink);">Full Spoken Radio Script</h3><p style="margin:0;font-size:14px;color:var(--body);line-height:1.6;">' + esc(ex.spokenScript) + '</p></div>'
    ) : '';

    var bannerImg = DATA.images.groundOps || 'assets/section-ground-ops.jpg';

    return '<div class="section-banner-shell">' +
        '<div class="section-banner">' +
          '<img src="' + esc(bannerImg) + '" alt="Section 2 Banner" />' +
          '<div class="section-banner-scrim"></div>' +
          '<div class="section-banner-content">' +
            '<div class="section-banner-kicker"><span>ENAC GSEA</span> · <span>Section 2 · European &amp; ICAO Operations</span></div>' +
            '<h1 class="section-banner-title">VHF Ground Operations Gap-Fill Drills</h1>' +

          '</div>' +

          '</div>' +
        '</div>' +

      '<div class="beta-notice-banner" role="note">' +
        '<div><strong>IMPORTANT:</strong> This is a beta version, so there may be some inaccuracies and errors. It is for training purposes only. These messages are AI-generated and are intended for practice only. Accents are added just to give variation and are not intended to replicate regional accents.</div>' +
      '</div>' +

      '<!-- STAGE 1: SELECT CATEGORY & DRILL -->' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Stage 1</span>' +
            '<div>' +
              '<h2 class="stage-title">Select Operational Category &amp; Drill</h2>' +
              '<p class="stage-help-text">Choose an airport operational service and exercise number.</p>' +
            '</div>' +

        '<div class="tabs">' + catTabs + '</div>' +
        '<div class="clip-nav">' + exNums + '</div>' +
        '<div class="scenario-spotlight">' +
          '<div class="scenario-spotlight-top">' +
            '<span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;">' + esc(catNames[state.gapCat] || state.gapCat) + ' · Drill ' + (state.gapIdx + 1) + ' of ' + byCat.length + '</span>' +
            '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);">' + esc(ex.airportName || '') + ' (' + esc(ex.airportIcao || '') + ')</span>' +
          '</div>' +
          '<h3 class="scenario-spotlight-title">' + esc(ex.title) + '</h3>' +
          '<p class="scenario-spotlight-hint">' + esc(ex.situationContext || '') + '</p>' +
        '</div>' +
      '</div>' +

      '<!-- STAGE 2: LISTEN TO TRANSMISSION -->' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Stage 2</span>' +
            '<div>' +
              '<h2 class="stage-title">Listen to Ground VHF Transmission</h2>' +

            '<span>Playback speed:</span>' +
            '<button class="spd-btn' + (state.speed === 0.85 ? ' active' : '') + '" data-spd="0.85">0.85x (Slower)</button>' +
            '<button class="spd-btn' + (state.speed === 1 ? ' active' : '') + '" data-spd="1">1.0x (Normal)</button>' +

      '<div class="stage-card">' +

              '<p class="stage-help-text">Type the exact aviation phraseology into the blanks, then check your answers.</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
        summaryHtml +
        '<div class="gap-text">' + renderedText + '</div>' +
        '<div class="row-between">' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            (!checked ? '<button class="btn btn-primary" id="check-gap">Check My Answers</button>' : '<button class="btn" id="retry-gap">Try Drill Again</button>') +
            (checked && ex.spokenScript ? '<button class="btn" id="toggle-gap-script">' + (state.showGapScript[ex.id] ? 'Hide Spoken Script' : 'Show Spoken Script') + '</button>' : '') +
          '</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn" id="prev-gap"' + (state.gapIdx === 0 ? ' disabled' : '') + '>← Previous Drill</button>' +
            '<button class="btn btn-primary" id="next-gap"' + (state.gapIdx >= byCat.length - 1 ? ' disabled' : '') + '>Next Drill →</button>' +
          '</div>' +
        '</div>' +
        scriptHtml +
      '</div>';

      { id: 'all', label: 'All Calls (' + DATA.pilotMessages.length + ')' },
      { id: 'routine', label: 'Routine (' + DATA.pilotMessages.filter(function(m) { return m.messageType === 'routine'; }).length + ')' },
      { id: 'non_routine', label: 'Non-Routine (' + DATA.pilotMessages.filter(function(m) { return m.messageType === 'non_routine'; }).length + ')' }
    ].map(function(f) {
      return '<button class="tab' + (state.pilotFilter === f.id ? ' active' : '') + '" data-pfilter="' + f.id + '">' + f.label + '</button>';
    }).join('');

    var exNums = list.map(function(item, idx) {
      var isCur = idx === state.pilotIdx;
      var isDone = !!state.checkedPilot[item.id];
      var cls = 'clip-num' + (isCur ? ' active' : '') + (isDone ? ' done' : '');
      return '<button class="' + cls + '" data-pidx="' + idx + '" title="' + esc(item.title) + '">Call ' + String(idx + 1).padStart(2, '0') + (isDone ? ' ✓' : '') + '</button>';
    }).join('');

    var correctCount = 0;
    var renderedText = esc(ex.templateText).replace(/\{\{(\d+)\}\}/g, function(_m, idxStr) {
      var idx = Number(idxStr);
      var blank = ex.blanks[idx];
      if (!blank) return '';
      var val = vals[idx] || '';
      var isOk = false;
      if (checked) {
        var nVal = normAns(val);
        isOk = blank.acceptedAnswers.some(function(a) { return normAns(a) === nVal; }) || normAns(blank.answer) === nVal;
        if (isOk) correctCount++;
      }
      var cls = 'gap-input' + (checked ? (isOk ? ' ok' : ' wrong') : '');
      var ph = state.showHints ? blank.hint : 'Type answer';
      return '<input class="' + cls + '" data-pblank="' + idx + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + (checked ? ' disabled' : '') + ' />' +
        (checked && !isOk ? '<span class="gap-ans">(' + esc(blank.answer) + ')</span>' : '');
    });

    var summaryHtml = checked ? (
      '<div class="feedback-box"><strong>Evaluation Result:</strong> You got <strong>' + correctCount + ' of ' + ex.blanks.length + '</strong> gaps correct. See the full debrief below for Phase of Flight, Context &amp; Useful Vocabulary.</div>'
    ) : '';

    var debriefHtml = '';
    if (checked) {
      var vocabItems = (ex.usefulVocabulary || []).map(function(v) {
        return '<div class="vocab-item"><p class="vocab-term">' + esc(v.term) + '</p><p class="vocab-meaning">' + esc(v.meaning) + '</p></div>';
      }).join('');
      debriefHtml = '<div class="debrief-grid" style="margin-top:20px;">' +
          '<div class="debrief-box">' +
            '<p class="debrief-kicker">Phase of Flight</p>' +
            '<p class="debrief-phase">' + esc(ex.phaseOfFlight) + '</p>' +
            '<p class="meta" style="margin:0;font-family:ui-monospace,Menlo,monospace;">' + esc(ex.sector) + ' · ' + esc(ex.frequencyMHz) + ' MHz</p>' +
          '</div>' +
          '<div class="debrief-box">' +
            '<p class="debrief-kicker">Situation Context</p>' +
            '<p style="margin:6px 0 0;font-size:13px;color:var(--body);line-height:1.6;">' + esc(ex.contextSummary) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="vocab-box">' +
          '<p class="debrief-kicker" style="color:var(--ink);">Useful Aviation Vocabulary</p>' +
          '<div class="vocab-grid">' + vocabItems + '</div>' +
        '</div>';
    }

    var scriptHtml = checked && state.showPilotScript[ex.id] && ex.spokenScript ? (
      '<div class="transcript"><h3 style="margin:0 0 8px;font-size:15px;color:var(--ink);">Full Spoken Radio Script</h3><p style="margin:0;font-size:14px;color:var(--body);line-height:1.6;">' + esc(ex.spokenScript) + '</p></div>'
    ) : '';

    var typeLabel = ex.messageType === 'non_routine' ? 'Non-Routine Pilot Call' : 'Routine Pilot Call';
    var typeColor = ex.messageType === 'non_routine' ? '#b45309' : 'var(--accent)';
    var bannerImg = DATA.images.pilotMessages || 'assets/section-pilot-messages.jpg';

    return '<div class="section-banner-shell">' +
        '<div class="section-banner">' +
          '<img src="' + esc(bannerImg) + '" alt="Section 3 Banner" />' +
          '<div class="section-banner-scrim"></div>' +
          '<div class="section-banner-content">' +
            '<div class="section-banner-kicker"><span>ENAC GSEA</span> · <span>Section 3 · Cockpit Pilot Calls</span></div>' +
            '<h1 class="section-banner-title">Routine &amp; Non-Routine Pilot Transmissions</h1>' +
            '<p class="section-banner-desc">Listen to cockpit VHF radio transmissions across active European frequencies. Fill 3 key gaps to unlock flight phase, context, and useful vocabulary.</p>' +
          '</div>' +
          '<div class="section-banner-stats">' +
            '<span class="banner-stat-pill"><strong>' + DATA.pilotMessages.length + '</strong> Calls Available</span>' +
            '<span class="banner-stat-pill' + (Object.keys(state.checkedPilot).length > 0 ? ' ok' : '') + '"><strong>' + Object.keys(state.checkedPilot).length + '</strong> Practiced</span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="beta-notice-banner" role="note">' +
        '<div><strong>IMPORTANT:</strong> This is a beta version, so there may be some inaccuracies and errors. It is for training purposes only. These messages are AI-generated and are intended for practice only. Accents are added just to give variation and are not intended to replicate regional accents.</div>' +
      '</div>' +

      '<!-- STAGE 1: SELECT COCKPIT CALL -->' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Stage 1</span>' +
            '<div>' +
              '<h2 class="stage-title">Select Cockpit Call (' + (state.pilotIdx + 1) + ' of ' + list.length + ')</h2>' +
              '<p class="stage-help-text">Choose between routine and non-routine cockpit transmissions.</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tabs">' + filterTabs + '</div>' +
        '<div class="clip-nav">' + exNums + '</div>' +
        '<div class="scenario-spotlight">' +
          '<div class="scenario-spotlight-top">' +
            '<span style="font-weight:700;color:' + typeColor + ';font-size:12px;text-transform:uppercase;">' + esc(typeLabel) + '</span>' +
            '<span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink);font-weight:700;">' + esc(ex.frequencyMHz) + ' MHz · ' + esc(ex.sector) + ' · ' + esc(ex.callsign) + '</span>' +
          '</div>' +
          '<h3 class="scenario-spotlight-title">' + esc(ex.title) + '</h3>' +
        '</div>' +
      '</div>' +

      '<!-- STAGE 2: LISTEN TO TRANSMISSION -->' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Stage 2</span>' +
            '<div>' +
              '<h2 class="stage-title">Listen to Cockpit VHF Call</h2>' +
              '<p class="stage-help-text">Tune to ' + esc(ex.frequencyMHz) + ' MHz and listen to the pilot’s cockpit transmission.</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="audio-box">' +
          renderAudioPlayerHtml('pilot-audio', ex.audioSrc) +
          '<div class="speed-row">' +
            '<span>Playback speed:</span>' +
            '<button class="spd-btn' + (state.speed === 0.85 ? ' active' : '') + '" data-spd="0.85">0.85x (Slower)</button>' +
            '<button class="spd-btn' + (state.speed === 1 ? ' active' : '') + '" data-spd="1">1.0x (Normal)</button>' +
            '<span style="font-family:ui-monospace,Menlo,monospace;color:var(--muted);">' + esc(ex.frequencyMHz) + ' MHz · Cockpit VHF</span>' +
            '<button class="spd-btn" id="toggle-pilot-hints" style="margin-left:auto;">' + (state.showHints ? 'Hide Hints' : 'Show Hints') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<!-- STAGE 3: FILL 3 GAPS & UNLOCK DEBRIEF -->' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Stage 3</span>' +
            '<div>' +
              '<h2 class="stage-title">Fill 3 Key Details &amp; Unlock Debrief</h2>' +
              '<p class="stage-help-text">Complete the missing words from the pilot’s transmission to reveal the flight debrief.</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
        summaryHtml +
        '<div class="gap-text">' + renderedText + '</div>' +
        '<div class="row-between">' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            (!checked ? '<button class="btn btn-primary" id="check-pilot">Check My Answers</button>' : '<button class="btn" id="retry-pilot">Try Call Again</button>') +
            (checked ? '<button class="btn" id="toggle-pilot-script">' + (state.showPilotScript[ex.id] ? 'Hide Spoken Script' : 'Show Spoken Script') + '</button>' : '') +
          '</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn" id="prev-pilot" ' + (state.pilotIdx === 0 ? 'disabled' : '') + '>← Previous Call</button>' +
            '<button class="btn btn-primary" id="next-pilot"' + (state.pilotIdx >= list.length - 1 ? ' disabled' : '') + '>Next Call →</button>' +
          '</div>' +
        '</div>' +
        debriefHtml +
        scriptHtml +
      '</div>';
  }

  function renderProgress() {
    var s = getProgressSummary();
    var trackingMode = scormApi ? 'Moodle SCORM 1.2 Active' : 'Browser Auto-Save (Offline / GitHub)';
    var trackingNote = scormApi
      ? 'Scores, completed clips, and per-clip results sync automatically to Moodle.'
      : 'Saved locally in your browser. Export CSV or copy your summary to share with your teacher.';

    var rowsHtml = s.rows.length > 0 ? (
      '<div class="progress-log-wrap">' +
        '<table class="progress-log-table">' +
          '<thead><tr><th>Section</th><th>Clip / Exercise</th><th>Result</th><th>Accuracy</th></tr></thead>' +
          '<tbody>' +
            s.rows.map(function(r) {
              var badgeColor = r.pct >= 70 ? 'color:var(--ok-ink);background:var(--ok-bg);' : 'color:var(--miss-ink);background:var(--miss-bg);';
              return '<tr>' +
                '<td style="white-space:nowrap;font-weight:600;">' + esc(r.section) + '</td>' +
                '<td>' + esc(r.title) + '</td>' +
                '<td style="font-family:ui-monospace,Menlo,monospace;white-space:nowrap;">' + esc(r.scoreText) + '</td>' +
                '<td><span style="padding:2px 8px;border-radius:9999px;font-weight:700;font-size:12px;' + badgeColor + '">' + r.pct + '%</span></td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>'
    ) : '<div class="feedback-box" style="margin-bottom:0;">No clips checked yet. Open Section 1, 2, or 3 and click <strong>Check My Answers</strong> to start recording your progress.</div>';

    return '<div class="progress-summary-grid">' +
        '<div class="progress-stat-card">' +
          '<p class="progress-stat-lbl">Clips Completed</p>' +
          '<p class="progress-stat-val">' + s.totalDone + ' / ' + s.totalAll + '</p>' +
          '<p class="progress-stat-sub">' + (s.totalAll > 0 ? Math.round((s.totalDone / s.totalAll) * 100) : 0) + '% of full hub practiced</p>' +
        '</div>' +
        '<div class="progress-stat-card">' +
          '<p class="progress-stat-lbl">Average Accuracy</p>' +
          '<p class="progress-stat-val">' + s.overallAvg + '%</p>' +
          '<p class="progress-stat-sub">Across ' + s.totalDone + ' completed exercise' + (s.totalDone === 1 ? '' : 's') + '</p>' +
        '</div>' +
        '<div class="progress-stat-card">' +
          '<p class="progress-stat-lbl">Tracking Mode</p>' +
          '<p class="progress-stat-val" style="font-size:16px;padding-top:4px;">' + esc(trackingMode) + '</p>' +
          '<p class="progress-stat-sub">' + esc(trackingNote) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="stage-card">' +
        '<div class="stage-head">' +
          '<div class="stage-head-left">' +
            '<span class="stage-num-badge amber">Sections</span>' +
            '<div>' +
              '<h2 class="stage-title">Progress by Listening Section</h2>' +
              '<p class="stage-help-text">Completion count and average accuracy per module.</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="progress-section-grid">' +
          '<div class="progress-section-card">' +
            '<p class="progress-stat-lbl">Section 1 · Real ATC</p>' +
            '<p class="progress-stat-val" style="font-size:20px;">' + s.realDone + ' / ' + s.realTotal + '</p>' +
            '<p class="progress-stat-sub">Avg accuracy: ' + s.realAvg + '%</p>' +
          '</div>' +
          '<div class="progress-section-card">' +
            '<p class="progress-stat-lbl">Section 2 · Ground Ops</p>' +
            '<p class="progress-stat-val" style="font-size:20px;">' + s.gapDone + ' / ' + s.gapTotal + '</p>' +
            '<p class="progress-stat-sub">Avg accuracy: ' + s.gapAvg + '%</p>' +
          '</div>' +
          '<div class="progress-section-card">' +
            '<p class="progress-stat-lbl">Section 3 · Pilot Calls</p>' +
            '<p class="progress-stat-val" style="font-size:20px;">' + s.pilotDone + ' / ' + s.pilotTotal + '</p>' +
            '<p class="progress-stat-sub">Avg accuracy: ' + s.pilotAvg + '%</p>' +
          '</div>' +
        '</div>' +
        '<div class="progress-action-row">' +
          '<button type="button" class="btn btn-primary" id="copy-progress-btn">📋 Copy Summary for Teacher</button>' +
          '<button type="button" class="btn" id="csv-progress-btn">⬇️ Download CSV Report</button>' +
          '<button type="button" class="btn" id="reset-progress-btn" style="margin-left:auto;">🗑️ Reset Progress</button>' +
          '<span id="progress-copy-toast" class="progress-copy-toast">Copied to clipboard!</span>' +
        '</div>' +
        rowsHtml +
      '</div>';
  }

  function wrapInDrawer(drawerContent, tag, title) {
    return '<div class="hub-underlay" aria-hidden="true">' + renderHome() + '</div>' +
      '<div id="drawer-backdrop" class="drawer-backdrop" role="button" aria-label="Close exercise drawer"></div>' +
      '<div id="drawer-container" class="drawer-container" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<div class="drawer-header">' +
          '<div class="drawer-title-group">' +
            '<span id="drawer-tag" class="drawer-tag">' + esc(tag) + '</span>' +
            '<h2 id="drawer-title" class="drawer-header-title">' + esc(title) + '</h2>' +
          '</div>' +
          '<div class="drawer-header-actions">' +
            '<button id="drawer-close-btn" class="drawer-close-btn" type="button" aria-label="Close exercise drawer">' +
              '<span>✕ Close Hub</span>' +
              '<kbd class="drawer-close-kbd">ESC</kbd>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="drawer-body" id="drawer-body">' +
          drawerContent +
        '</div>' +
      '</div>';
  }

  function attachDrawerClose(root) {
    var closeDrawer = function() {
      root.querySelectorAll('audio').forEach(function(a) { try { a.pause(); } catch(e) {} });
      drawerMounted = false;
      state.view = 'home';
      render();
    };
    var cb = document.getElementById('drawer-close-btn');
    if (cb) cb.onclick = closeDrawer;
    var bd = document.getElementById('drawer-backdrop');
    if (bd) bd.onclick = closeDrawer;
  }

  function render(opts) {
    opts = opts || {};
    renderNav();
    var root = document.getElementById('app');
    if (!root) return;

    if (state.view === 'home') {
      drawerMounted = false;
      if (typeof document !== 'undefined' && document.body && document.body.classList) {
        document.body.classList.remove('drawer-open');
      }
      root.innerHTML = '<div class="hub-view">' + renderHome() + '</div>';
      var b1 = document.getElementById('go-real');
      var b2 = document.getElementById('go-gap');
      var b3 = document.getElementById('go-pilot');
      var h1 = document.getElementById('hero-real');
      var h2 = document.getElementById('hero-gap');
      var h3 = document.getElementById('hero-pilot');
      if (b1) b1.onclick = function() { state.view = 'real'; render(); };
      if (b2) b2.onclick = function() { state.view = 'gap'; render(); };
      if (b3) b3.onclick = function() { state.view = 'pilot'; render(); };
      if (h1) h1.onclick = function() { state.view = 'real'; render(); };
      if (h2) h2.onclick = function() { state.view = 'gap'; render(); };
      if (h3) h3.onclick = function() { state.view = 'pilot'; render(); };
      root.querySelectorAll('[data-home-cat]').forEach(function(btn) {
        btn.onclick = function() {
          state.gapCat = btn.getAttribute('data-home-cat');
          state.gapIdx = 0;
          state.view = 'gap';
          render();
        };
      });
      return;
    }

    if (typeof document !== 'undefined' && document.body && document.body.classList) {
      document.body.classList.add('drawer-open');
    }

    var tag = '';
    var title = '';
    var contentHtml = '';
    if (state.view === 'real') {
      tag = 'SECTION 1 · REAL ATC';
      title = 'Real Pilot–Controller Word Identification (' + DATA.realDrills.length + ' Clips)';
      contentHtml = renderReal();
    } else if (state.view === 'pilot') {
      tag = 'SECTION 3 · PILOT CALLS';
      title = 'Routine & Non-Routine Pilot Messages (' + DATA.pilotMessages.length + ' Calls)';
      contentHtml = renderPilot();
    } else if (state.view === 'progress') {
      tag = 'PROGRESS · REPORT';
      title = 'Listening Progress & Teacher Report';
      contentHtml = renderProgress();
    } else {
      tag = 'SECTION 2 · GROUND OPS';
      title = 'European & ICAO Ground Operations Gap-Fill (' + DATA.gapExercises.length + ' Drills)';
      contentHtml = renderGap();
    }

    if (!drawerMounted) {
      root.innerHTML = wrapInDrawer(contentHtml, tag, title);
      drawerMounted = true;
      attachDrawerClose(root);
    } else {
      var tagEl = document.getElementById('drawer-tag');
      var titleEl = document.getElementById('drawer-title');
      var containerEl = document.getElementById('drawer-container');
      var bodyEl = document.getElementById('drawer-body');
      if (tagEl) tagEl.textContent = tag;
      if (titleEl) titleEl.textContent = title;
      if (containerEl && containerEl.setAttribute) containerEl.setAttribute('aria-label', title);
      if (bodyEl) {
        if (!opts.preserveScroll) {
          bodyEl.querySelectorAll('audio').forEach(function(a) { try { a.pause(); } catch(e) {} });
        }
        var prevScroll = bodyEl.scrollTop || 0;
        bodyEl.innerHTML = contentHtml;
        bodyEl.scrollTop = opts.preserveScroll ? prevScroll : 0;
      }
    }

    var scope = document.getElementById('drawer-body') || root;

    if (state.view === 'real') {
      var drill = DATA.realDrills[state.realIdx];
      var audio = document.getElementById('clip-audio');
      bindCustomAudioPlayer('clip-audio');
      scope.querySelectorAll('[data-spd]').forEach(function(b) {
        b.onclick = function() {
          state.speed = Number(b.getAttribute('data-spd'));
          if (audio) audio.playbackRate = state.speed;
          scope.querySelectorAll('[data-spd]').forEach(function(x) {
            x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
          });
        };
      });
      scope.querySelectorAll('[data-ridx]').forEach(function(b) {
        b.onclick = function() { state.realIdx = Number(b.getAttribute('data-ridx')); render(); };
      });
      scope.querySelectorAll('[data-word]').forEach(function(b) {
        b.onclick = function() {
          var w = b.getAttribute('data-word');
          if (!state.selectedWords[drill.id]) state.selectedWords[drill.id] = {};
          state.selectedWords[drill.id][w] = !state.selectedWords[drill.id][w];
          var isPicked = !!state.selectedWords[drill.id][w];
          b.classList.toggle('selected', isPicked);
          var selCount = Object.values(state.selectedWords[drill.id] || {}).filter(Boolean).length;
          var counterEl = document.getElementById('sel-counter');
          if (counterEl) {
            counterEl.textContent = selCount + ' word' + (selCount === 1 ? '' : 's') + ' selected';
          }
        };
      });
      var chk = document.getElementById('check-real');
      if (chk) chk.onclick = function() {
        var sel = state.selectedWords[drill.id] || {};
        var hits = 0, wrong = 0;
        drill.heardWords.forEach(function(w) { if (sel[w]) hits++; });
        drill.distractorWords.forEach(function(w) { if (sel[w]) wrong++; });
        var total = drill.heardWords.length || 1;
        var pct = Math.round((Math.max(0, hits - wrong) / total) * 100);
        state.checkedReal[drill.id] = true;
        state.scores.real[drill.id] = { hits: hits, total: total, wrong: wrong, pct: pct };
        markProgress({ id: 'S1_' + drill.id, response: hits + '/' + total + ' (' + pct + '%)', pct: pct });
        render({ preserveScroll: true });
      };
      var retry = document.getElementById('retry-real');
      if (retry) retry.onclick = function() {
        delete state.checkedReal[drill.id];
        delete state.scores.real[drill.id];
        state.selectedWords[drill.id] = {};
        saveProgress();
        render({ preserveScroll: true });
      };
      var prev = document.getElementById('prev-real');
      if (prev) prev.onclick = function() { if (state.realIdx > 0) { state.realIdx--; render(); } };
      var next = document.getElementById('next-real');
      if (next) next.onclick = function() { if (state.realIdx < DATA.realDrills.length - 1) { state.realIdx++; render(); } };
      return;
    }

    if (state.view === 'pilot') {
      var pList = getFilteredPilotMessages();
      var pEx = pList[state.pilotIdx] || pList[0];
      var pAudio = document.getElementById('pilot-audio');
      bindCustomAudioPlayer('pilot-audio');
      scope.querySelectorAll('[data-spd]').forEach(function(b) {
        b.onclick = function() {
          state.speed = Number(b.getAttribute('data-spd'));
          if (pAudio) pAudio.playbackRate = state.speed;
          scope.querySelectorAll('[data-spd]').forEach(function(x) {
            x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
          });
        };
      });
      scope.querySelectorAll('[data-pfilter]').forEach(function(b) {
        b.onclick = function() { state.pilotFilter = b.getAttribute('data-pfilter'); state.pilotIdx = 0; render(); };
      });
      scope.querySelectorAll('[data-pidx]').forEach(function(b) {
        b.onclick = function() { state.pilotIdx = Number(b.getAttribute('data-pidx')); render(); };
      });
      scope.querySelectorAll('[data-pblank]').forEach(function(inp) {
        inp.oninput = function() {
          var idx = Number(inp.getAttribute('data-pblank'));
          if (!state.pilotValues[pEx.id]) state.pilotValues[pEx.id] = {};
          state.pilotValues[pEx.id][idx] = inp.value;
        };
      });
      var tph = document.getElementById('toggle-pilot-hints');
      if (tph) tph.onclick = function() {
        state.showHints = !state.showHints;
        tph.textContent = state.showHints ? 'Hide Hints' : 'Show Hints';
        scope.querySelectorAll('[data-pblank]').forEach(function(inp) {
          var idx = Number(inp.getAttribute('data-pblank'));
          var blank = pEx && pEx.blanks && pEx.blanks[idx];
          if (blank) inp.setAttribute('placeholder', state.showHints ? blank.hint : 'Type answer');
        });
      };
      var cp = document.getElementById('check-pilot');
      if (cp) cp.onclick = function() {
        var vals = state.pilotValues[pEx.id] || {};
        var correct = 0;
        var total = pEx.blanks.length || 1;
        pEx.blanks.forEach(function(blank, idx) {
          var nVal = normAns(vals[idx] || '');
          if (blank.acceptedAnswers.some(function(a) { return normAns(a) === nVal; }) || normAns(blank.answer) === nVal) {
            correct++;
          }
        });
        var pct = Math.round((correct / total) * 100);
        state.checkedPilot[pEx.id] = true;
        state.scores.pilot[pEx.id] = { correct: correct, total: total, pct: pct };
        markProgress({ id: 'S3_' + pEx.id, response: correct + '/' + total + ' (' + pct + '%)', pct: pct });
        render({ preserveScroll: true });
      };
      var rp = document.getElementById('retry-pilot');
      if (rp) rp.onclick = function() {
        delete state.checkedPilot[pEx.id];
        delete state.scores.pilot[pEx.id];
        state.pilotValues[pEx.id] = {};
        saveProgress();
        render({ preserveScroll: true });
      };
      var tps = document.getElementById('toggle-pilot-script');
      if (tps) tps.onclick = function() { state.showPilotScript[pEx.id] = !state.showPilotScript[pEx.id]; render({ preserveScroll: true }); };
      var pp = document.getElementById('prev-pilot');
      if (pp) pp.onclick = function() { if (state.pilotIdx > 0) { state.pilotIdx--; render(); } };
      var np = document.getElementById('next-pilot');
      if (np) np.onclick = function() { if (state.pilotIdx < pList.length - 1) { state.pilotIdx++; render(); } };
      return;
    }

    if (state.view === 'progress') {
      var copyBtn = document.getElementById('copy-progress-btn');
      var csvBtn = document.getElementById('csv-progress-btn');
      var resetBtn = document.getElementById('reset-progress-btn');
      if (copyBtn) copyBtn.onclick = function() {
        var s = getProgressSummary();
        var lines = [
          'ENAC GSEA Listening Comprehension Hub — Progress Summary',
          'Date: ' + new Date().toISOString().slice(0, 10),
          'Completed: ' + s.totalDone + '/' + s.totalAll + ' clips | Average Accuracy: ' + s.overallAvg + '%',
          'Section 1 (Real ATC): ' + s.realDone + '/' + s.realTotal + ' (' + s.realAvg + '%)',
          'Section 2 (Ground Ops): ' + s.gapDone + '/' + s.gapTotal + ' (' + s.gapAvg + '%)',
          'Section 3 (Pilot Calls): ' + s.pilotDone + '/' + s.pilotTotal + ' (' + s.pilotAvg + '%)',
          ''
        ].concat(s.rows.map(function(r) {
          return '- [' + r.section + '] ' + r.title + ': ' + r.scoreText + ' (' + r.pct + '%)';
        }));
        var text = lines.join('\n');
        var showToast = function() {
          var t = document.getElementById('progress-copy-toast');
          if (t) {
            t.style.display = 'inline-block';
            setTimeout(function() { if (t) t.style.display = 'none'; }, 2500);
          }
        };
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showToast).catch(function() {
            if (typeof window !== 'undefined' && window.prompt) window.prompt('Copy progress summary:', text);
          });
        } else if (typeof window !== 'undefined' && window.prompt) {
          window.prompt('Copy progress summary:', text);
        }
      };
      if (csvBtn) csvBtn.onclick = function() {
        var s = getProgressSummary();
        var csvCell = function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; };
        var csvLines = ['"Section","Exercise","Result","Accuracy (%)"'].concat(s.rows.map(function(r) {
          return [csvCell(r.section), csvCell(r.title), csvCell(r.scoreText), csvCell(r.pct)].join(',');
        }));
        try {
          var blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'ENAC_GSEA_Listening_Progress_' + new Date().toISOString().slice(0, 10) + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {}
      };
      if (resetBtn) resetBtn.onclick = function() {
        if (typeof window !== 'undefined' && window.confirm && !window.confirm('Reset all recorded clip completions and scores?')) return;
        state.checkedReal = {};
        state.checkedGap = {};
        state.checkedPilot = {};
        state.selectedWords = {};
        state.gapValues = {};
        state.pilotValues = {};
        state.scores = { real: {}, gap: {}, pilot: {} };
        saveProgress();
        render({ preserveScroll: false });
      };
      return;
    }

    // Gap View
    var byCat = DATA.gapExercises.filter(function(g) { return g.category === state.gapCat; });
    var ex = byCat[state.gapIdx] || byCat[0];
    var gAudio = document.getElementById('gap-audio');
    bindCustomAudioPlayer('gap-audio');
    scope.querySelectorAll('[data-spd]').forEach(function(b) {
      b.onclick = function() {
        state.speed = Number(b.getAttribute('data-spd'));
        if (gAudio) gAudio.playbackRate = state.speed;
        scope.querySelectorAll('[data-spd]').forEach(function(x) {
          x.classList.toggle('active', Number(x.getAttribute('data-spd')) === state.speed);
        });
      };
    });
    scope.querySelectorAll('[data-cat]').forEach(function(b) {
      b.onclick = function() { state.gapCat = b.getAttribute('data-cat'); state.gapIdx = 0; render(); };
    });
    scope.querySelectorAll('[data-gidx]').forEach(function(b) {
      b.onclick = function() { state.gapIdx = Number(b.getAttribute('data-gidx')); render(); };
    });
    scope.querySelectorAll('[data-blank]').forEach(function(inp) {
      inp.oninput = function() {
        var idx = Number(inp.getAttribute('data-blank'));
        if (!state.gapValues[ex.id]) state.gapValues[ex.id] = {};
        state.gapValues[ex.id][idx] = inp.value;
      };
    });
    var th = document.getElementById('toggle-hints');
    if (th) th.onclick = function() {
      state.showHints = !state.showHints;
      th.textContent = state.showHints ? 'Hide Hints' : 'Show Hints';
      scope.querySelectorAll('[data-blank]').forEach(function(inp) {
        var idx = Number(inp.getAttribute('data-blank'));
        var blank = ex && ex.blanks && ex.blanks[idx];
        if (blank) inp.setAttribute('placeholder', state.showHints ? blank.hint : 'Type answer');
      });
    };
    var cg = document.getElementById('check-gap');
    if (cg) cg.onclick = function() {
      var vals = state.gapValues[ex.id] || {};
      var correct = 0;
      var total = ex.blanks.length || 1;
      ex.blanks.forEach(function(blank, idx) {
        var nVal = normAns(vals[idx] || '');
        if (blank.acceptedAnswers.some(function(a) { return normAns(a) === nVal; }) || normAns(blank.answer) === nVal) {
          correct++;
        }
      });
      var pct = Math.round((correct / total) * 100);
      state.checkedGap[ex.id] = true;
      state.scores.gap[ex.id] = { correct: correct, total: total, pct: pct };
      markProgress({ id: 'S2_' + ex.id, response: correct + '/' + total + ' (' + pct + '%)', pct: pct });
      render({ preserveScroll: true });
    };
    var rg = document.getElementById('retry-gap');
    if (rg) rg.onclick = function() {
      delete state.checkedGap[ex.id];
      delete state.scores.gap[ex.id];
      state.gapValues[ex.id] = {};
      saveProgress();
      render({ preserveScroll: true });
    };
    var tgs = document.getElementById('toggle-gap-script');
    if (tgs) tgs.onclick = function() { state.showGapScript[ex.id] = !state.showGapScript[ex.id]; render({ preserveScroll: true }); };
    var pg = document.getElementById('prev-gap');
    if (pg) pg.onclick = function() { if (state.gapIdx > 0) { state.gapIdx--; render(); } };
    var ng = document.getElementById('next-gap');
    if (ng) ng.onclick = function() { if (state.gapIdx < byCat.length - 1) { state.gapIdx++; render(); } };
  }

  // Keyboard shortcut: ESC closes active exercise drawer
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && state.view !== 'home') {
      var root = document.getElementById('app');
      if (root) root.querySelectorAll('audio').forEach(function(a) { try { a.pause(); } catch(err) {} });
      drawerMounted = false;
      state.view = 'home';
      render();
    }
  });

  restoreProgress();
  render();
})();
</script>
</body>
</html>
